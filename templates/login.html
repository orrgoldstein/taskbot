<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Bot - כניסה</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(160deg, #0F172A, #1E293B, #0F172A);
            color: #E2E8F0; min-height: 100vh; direction: rtl;
            display: flex; align-items: center; justify-content: center;
        }
        .login-box {
            background: rgba(30,41,59,0.8); border-radius: 20px;
            padding: 40px; width: 380px; max-width: 90vw;
            border: 1px solid rgba(100,116,139,0.2);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
        }
        .logo {
            width: 64px; height: 64px; border-radius: 18px;
            background: linear-gradient(135deg, #0088cc, #29B6F6);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; margin: 0 auto 20px;
            box-shadow: 0 4px 20px rgba(0,136,204,0.4);
        }
        h1 { text-align: center; font-size: 22px; margin-bottom: 6px; color: #F8FAFC; }
        .subtitle { text-align: center; font-size: 13px; color: #64748B; margin-bottom: 28px; }
        label { display: block; font-size: 13px; color: #94A3B8; margin-bottom: 6px; }
        input {
            width: 100%; background: rgba(15,23,42,0.6);
            border: 1px solid rgba(100,116,139,0.25); border-radius: 12px;
            padding: 12px 16px; color: #E2E8F0; font-size: 14px;
            outline: none; direction: rtl; font-family: inherit;
            margin-bottom: 16px;
        }
        input:focus { border-color: rgba(0,136,204,0.5); }
        input::placeholder { color: #475569; }
        button {
            width: 100%; background: linear-gradient(135deg, #0088cc, #0077B5);
            color: #fff; border: none; border-radius: 12px;
            padding: 12px; font-size: 15px; font-weight: 600;
            cursor: pointer; font-family: inherit; transition: all 0.2s;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .error {
            background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
            border-radius: 10px; padding: 10px 14px; margin-bottom: 16px;
            color: #F87171; font-size: 13px; text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">✈️</div>
        <h1>Task Bot</h1>
        <p class="subtitle">הזן סיסמה כדי לגשת לדשבורד</p>
        
        {% if error %}
        <div class="error">❌ סיסמה שגויה, נסה שוב</div>
        {% endif %}
        
        <form method="POST" action="/login">
            <label>סיסמה</label>
            <input type="password" name="password" placeholder="הזן סיסמה..." autofocus>
            <button type="submit">כניסה</button>
        </form>
    </div>
</body>
</html>
